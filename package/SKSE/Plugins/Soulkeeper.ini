[General]
; Enable or disable the entire Soulkeeper system
bEnableMod = true
; Enable automatic weapon charging for the player
bEnablePlayerAutoCharge = true
; Enable automatic weapon charging for followers
bEnableFollowerAutoCharge = true
; Enable passive over-time weapon recharge
bEnablePassiveRecharge = true

[ChargeThreshold]
; Weapon charge percentage below which auto-charge triggers (e.g. 20.0 = 20%)
fChargeThreshold = 20.0

[Timers]
; Frequency in seconds between weapon charge checks
fCheckIntervalSeconds = 30.0

[SoulGems]
; Always use smallest adequate soul gem first
bPreferSmallestSoulGem = true
; Allow automatic usage of Grand Soul Gems
bAllowGrandSoulGems = true
; Allow automatic usage of Black Soul Gems
bAllowBlackSoulGems = false

[FollowerPurchase]
; Allow followers to buy soul gems with their own gold
bEnableFollowerPurchase = true
; Strictly use follower inventory gold only
bUseFollowerGoldOnly = true
; Maximum gold a follower is willing to spend per soul gem
uMaxPurchasePrice = 500
; Minimum gold a follower must keep after purchase
uMinGoldRemaining = 50

[PassiveRecharge]
; Interval in seconds between passive recharge ticks
fPassiveRechargeInterval = 60.0
; Percentage of max charge restored per tick
fPassiveRechargePercent = 1.0
; Allow passive recharge while in combat
bRechargeInCombat = false
; Slower tick interval during combat (if bRechargeInCombat is true)
fCombatRechargeInterval = 180.0

[Notifications]
; Enable top-left HUD notification messages
bEnableNotifications = true
; Show notification when player weapon is charged
bNotifyPlayerCharge = true
; Show notification when follower weapon is charged
bNotifyFollowerCharge = true
; Show notification when follower lacks soul gems
bNotifyNoSoulGems = true
; Show notification when follower buys a soul gem
bNotifyFollowerPurchase = true
; Show notification when follower cannot afford a soul gem
bNotifyFailedPurchase = true
; Show notification on passive recharge ticks
bNotifyPassiveRecharge = false
; Cooldown in seconds between repeat follower notifications
fNotificationCooldown = 300.0
